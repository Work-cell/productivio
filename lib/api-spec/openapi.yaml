openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: assistant
    description: User-keyed AI planner commands
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /assistant/commands:
    post:
      operationId: createAssistantCommandPlan
      tags: [assistant]
      summary: Turn a planner prompt into reviewable commands
      description: Calls the selected AI provider with a one-time user key and returns constrained planner commands. The key and prompt are not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantCommandRequest"
      responses:
        "200":
          description: Proposed planner commands
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantCommandPlan"
        "400":
          description: Invalid request or provider response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI provider request failed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]
    AssistantTaskContext:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        dueDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        category: { type: string, maxLength: 100 }
        priority: { type: string, enum: [high, medium, low] }
        completed: { type: boolean }
        projectId: { type: ["string", "null"], maxLength: 200 }
        calendarEventId: { type: ["string", "null"], maxLength: 200 }
      required: [id, title, dueDate, category, priority, completed, projectId, calendarEventId]
    AssistantProjectContext:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 200 }
        name: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 500 }
        progress: { type: number, minimum: 0, maximum: 100 }
        status: { type: string, enum: [on-track, at-risk, completed] }
      required: [id, name, description, progress, status]
    AssistantEventContext:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, maxLength: 200 }
        title: { type: string, maxLength: 200 }
        date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        startMinutes: { type: integer, minimum: 0, maximum: 1439 }
        endMinutes: { type: integer, minimum: 1, maximum: 1440 }
        color: { type: string, enum: [teal, coral, gold, lilac] }
        taskId: { type: ["string", "null"], maxLength: 200 }
      required: [id, title, date, startMinutes, endMinutes, color, taskId]
    AssistantCommandRequest:
      type: object
      additionalProperties: false
      properties:
        provider: { type: string, enum: [openai, anthropic] }
        apiKey: { type: string, minLength: 20, maxLength: 512, writeOnly: true }
        prompt: { type: string, minLength: 1, maxLength: 1200 }
        today: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        weekStart: { type: string, enum: [monday, sunday] }
        tasks:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AssistantTaskContext" }
        projects:
          type: array
          maxItems: 25
          items: { $ref: "#/components/schemas/AssistantProjectContext" }
        events:
          type: array
          maxItems: 50
          items: { $ref: "#/components/schemas/AssistantEventContext" }
      required: [provider, apiKey, prompt, today, weekStart, tasks, projects, events]
    AssistantCommandPlan:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, minLength: 1, maxLength: 500 }
        commands:
          type: array
          maxItems: 12
          items: { $ref: "#/components/schemas/AssistantCommand" }
      required: [summary, commands]
    AssistantCommand:
      oneOf:
        - $ref: "#/components/schemas/TaskAddCommand"
        - $ref: "#/components/schemas/TaskUpdateCommand"
        - $ref: "#/components/schemas/TaskRemoveCommand"
        - $ref: "#/components/schemas/ProjectAddCommand"
        - $ref: "#/components/schemas/ProjectUpdateCommand"
        - $ref: "#/components/schemas/ProjectRemoveCommand"
        - $ref: "#/components/schemas/EventAddCommand"
        - $ref: "#/components/schemas/EventUpdateCommand"
        - $ref: "#/components/schemas/EventRemoveCommand"
    TaskAddCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [task.add] }
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        category: { type: string, maxLength: 100 }
        priority: { type: string, enum: [high, medium, low] }
        projectId: { type: ["string", "null"], maxLength: 200 }
      required: [kind, title, dueDate]
    TaskUpdateCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [task.update] }
        id: { type: string, minLength: 1, maxLength: 200 }
        changes: { $ref: "#/components/schemas/TaskChanges" }
      required: [kind, id, changes]
    TaskChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        dueDate: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        category: { type: string, maxLength: 100 }
        priority: { type: string, enum: [high, medium, low] }
        completed: { type: boolean }
        projectId: { type: ["string", "null"], maxLength: 200 }
    TaskRemoveCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [task.remove] }
        id: { type: string, minLength: 1, maxLength: 200 }
      required: [kind, id]
    ProjectAddCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [project.add] }
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 3000 }
      required: [kind, name]
    ProjectUpdateCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [project.update] }
        id: { type: string, minLength: 1, maxLength: 200 }
        changes: { $ref: "#/components/schemas/ProjectChanges" }
      required: [kind, id, changes]
    ProjectChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 3000 }
        status: { type: string, enum: [on-track, at-risk] }
    ProjectRemoveCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [project.remove] }
        id: { type: string, minLength: 1, maxLength: 200 }
      required: [kind, id]
    EventAddCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [event.add] }
        title: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        startMinutes: { type: integer, minimum: 540, maximum: 1139 }
        endMinutes: { type: integer, minimum: 541, maximum: 1140 }
        color: { type: string, enum: [teal, coral, gold, lilac] }
      required: [kind, title, date, startMinutes, endMinutes, color]
    EventUpdateCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [event.update] }
        id: { type: string, minLength: 1, maxLength: 200 }
        changes: { $ref: "#/components/schemas/EventChanges" }
      required: [kind, id, changes]
    EventChanges:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        date: { type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$" }
        startMinutes: { type: integer, minimum: 540, maximum: 1139 }
        endMinutes: { type: integer, minimum: 541, maximum: 1140 }
        color: { type: string, enum: [teal, coral, gold, lilac] }
    EventRemoveCommand:
      type: object
      additionalProperties: false
      properties:
        kind: { type: string, enum: [event.remove] }
        id: { type: string, minLength: 1, maxLength: 200 }
      required: [kind, id]

